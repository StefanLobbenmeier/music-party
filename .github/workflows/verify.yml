name: Foundation verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:jvmTest :music-domain:jvmTest :spotify-api:jvmTest :composeApp:wasmJsBrowserDistribution
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix browser-tests
      - run: cd browser-tests && npx playwright install --with-deps chromium
      - run: npm test --prefix browser-tests
      # Archiving is optional; build and browser checks above remain required.
      - name: Archive production bundle (optional)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: foundation-static-site
          path: composeApp/build/dist/wasmJs/productionExecutable
